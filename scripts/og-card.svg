  <text x="80" y="556" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#a1a1aa">Jeongwon Park</text>
  <text x="253" y="556" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#52525b">Machine Learning Engineer</text>

  <text x="1120" y="556" text-anchor="end" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="20" fill="#52525b">jeparktech.github.io/jeongwon.log</text>
