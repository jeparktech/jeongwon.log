    <text x="42" y="20" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#fafafa">Jeongwon</text>
    <text x="145" y="20" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#71717a">Log</text>
  </g>

  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="66" font-weight="600" fill="#fafafa" letter-spacing="-1.6">
    <text x="80" y="288">Notes on engineering,</text>
    <text x="80" y="368">research, and what</text>
    <text x="80" y="448">I am learning.</text>
